# Hyprland config for Rigel Linux
# https://wiki.hyprland.org/Configuring/

# Монитор
monitor=,prefered,auto,1

# Язык (RU/EN)
exec-once=setxkbmap us,ru -option grp:alt_shift_toggle

# Автозапуск
exec-once=waybar
exec-once=hyprpaper
exec-once=swaync

# Вход в систему
exec-once=wl-paste -t text --watch cliphist store

# Обои
exec-once=hyprpaper &
exec-once=sleep 1 && hyprctl hyprpaper wallpaper ",~/.config/hypr/wallpaper.png"

# Клавиши
$mainMod = SUPER

bind = $mainMod, T, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, W, exec, swaync-client -t
bind = $mainMod, L, exec, hyprlock

# Переключение окон
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod_SHIFT, 1, movetoworkspace, 1
bind = $mainMod_SHIFT, 2, movetoworkspace, 2
bind = $mainMod_SHIFT, 3, movetoworkspace, 3
bind = $mainMod_SHIFT, 4, movetoworkspace, 4

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Громкость
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Яркость
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Плавность
decoration {
    rounding = 8
    blur = true
    blur_size = 4
    blur_passes = 2
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
}

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_autoreload = true
}