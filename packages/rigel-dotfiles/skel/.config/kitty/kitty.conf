# kitty config for Rigel Linux

font_family      JetBrainsMono Nerd Font
font_size        12
bold_font        auto
italic_font      auto
bold_italic_font auto

# Русская раскладка
cursor_shape     beam
cursor_beam_thickness 2

# Цвета (темная тема)
background       #1e1e2e
foreground       #cdd6f4
selection_background #45475a
selection_foreground #cdd6f4

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

shell_integration enabled
scrollback_lines 10000
tab_bar_style powerline
hide_window_decorations yes