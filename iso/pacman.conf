#
# pacman.conf для СБОРКИ ISO (profile/pacman.conf).
# Используется только mkarchiso, чтобы поставить пакеты внутрь airootfs.
# Настройки живой системы и целевой системы задаются отдельно
# (см. iso/airootfs/usr/local/bin/rigel-live-setup и installer/lib/packages.sh).
#

[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel     = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# multilib нужен, чтобы в целевой системе работали Steam и 32-битные библиотеки
[multilib]
Include = /etc/pacman.d/mirrorlist
