# Rigel 1 «Orion» — загрузка в режиме BIOS (isolinux/syslinux).
#
# mkarchiso копирует в /boot/syslinux ВСЕ модули *.c32 из пакета syslinux,
# поэтому menu.c32 доступен и меню работает без картинки-заставки.
# Подстановки %INSTALL_DIR%, %ARCH%, %ARCHISO_UUID%, %KERNEL_PARAMS%
# делает mkarchiso при сборке (см. _make_bootmode_bios.syslinux).

UI menu.c32
DEFAULT rigel
PROMPT 0
TIMEOUT 150
TOTALTIMEOUT 300
MENU TITLE Rigel Linux 1 "Orion" (BIOS)

LABEL rigel
    MENU LABEL Rigel 1 "Orion" (x86_64)
    MENU DEFAULT
    TEXT HELP
Установка и живая система Rigel на базе Arch Linux.
Русский язык, автоподбор драйверов, btrfs + снапшоты.
    ENDTEXT
    KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    APPEND initrd=/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL rigel-lts
    MENU LABEL Rigel 1 "Orion" — ядро LTS (запасной вариант)
    TEXT HELP
То же самое, но с ядром linux-lts: выручит на новом железе,
если основное ядро не загрузилось.
    ENDTEXT
    KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
    APPEND initrd=/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL existing
    MENU LABEL Загрузить уже установленную систему
    TEXT HELP
Загрузка операционной системы с жёсткого диска — вернуться к своей
системе, не вынимая флешку.
    ENDTEXT
    COM32 chain.c32
    APPEND hd0 0

LABEL reboot
    MENU LABEL Перезагрузить
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Выключить
    COM32 poweroff.c32
