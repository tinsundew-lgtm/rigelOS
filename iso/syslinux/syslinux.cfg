# Rigel 1 «Orion» — загрузка в режиме BIOS (syslinux/isolinux).
# Синтаксис намеренно «старый» (KERNEL/APPEND initrd=): он не требует
# модулей menu.c32 и работает даже если mkarchiso не положил их на ISO.
# Подстановки %INSTALL_DIR%, %ARCH%, %ARCHISO_UUID%, %KERNEL_PARAMS%
# делает mkarchiso при сборке.

DEFAULT rigel
PROMPT 1
TIMEOUT 150
TOTALTIMEOUT 300

LABEL rigel
    KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    APPEND initrd=/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL rigel-lts
    KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
    APPEND initrd=/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL memtest
    KERNEL /boot/memtest86+/memtest
