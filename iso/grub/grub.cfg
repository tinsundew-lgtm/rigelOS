# Rigel 1 «Orion» — загрузчик GRUB.
# Копия стиля CachyOS — проверенный рабочий конфиг.
RIGEL_VERSION="1"

if [ "${grub_platform}" == 'efi' ]; then
    bios_or_uefi='(UEFI)!'
else
    bios_or_uefi='(BIOS)!'
fi

# Загрузка модулей ФС
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Графический режим
insmod font
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

# Последовательный порт (опционально)
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Определение платформы
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

set default="0"
set timeout=15
set timeout_style=menu

# Текстовые приветствия
menuentry "Welcome to Rigel 1 «Orion» Live ISO $bios_or_uefi" {
    insmod ext2
}
menuentry "----------------------------------------------------" {
    insmod ext2
}

# Загрузка Rigel
menuentry "Rigel 1 «Orion»" --class arch --class gnu-linux --class gnu --class os --id 'rigel' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Rigel 1 «Orion» — ядро LTS" --class arch --class gnu-linux --class gnu --class os --id 'rigel-lts' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

# Мемтест (если есть)
if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Memtest86+ (тест RAM)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Memtest86+ (тест RAM)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

# UEFI Shell + Настройки прошивки
if [ "${grub_platform}" == 'efi' ]; then
    if [ -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    fi
    menuentry 'Настройки прошивки (UEFI)' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Выключить' --class shutdown --class poweroff {
    echo 'Питание выключается...'
    halt
}

menuentry 'Перезагрузить' --class reboot --class restart {
    echo 'Перезагрузка...'
    reboot
}