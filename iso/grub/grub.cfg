# Rigel 1 «Orion» — GRUB для live ISO.
# Подстановки %INSTALL_DIR%, %ARCH%, %ARCHISO_UUID%, %KERNEL_PARAMS% делает mkarchiso.

# Загрузка модулей ФС
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Графический режим
insmod font
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

set default="0"
set timeout=15

menuentry "Rigel 1 «Orion»" {
    set gfxpayload=keep
    linux  /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

menuentry "Rigel 1 «Orion» — ядро LTS" {
    set gfxpayload=keep
    linux  /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

menuentry "Перезагрузить" {
    reboot
}

menuentry "Выключить" {
    halt
}